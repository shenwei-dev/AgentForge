services:
  mysql:
    image: mysql:8.0
    container_name: agentforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeit}
      MYSQL_DATABASE: agentforge
      MYSQL_ROOT_HOST: "%"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: agentforge-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: agentforge
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-changeit}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-qianwen}
      QIANWEN_API_KEY: ${QIANWEN_API_KEY:?请在 .env 中设置 QIANWEN_API_KEY}
      AMD_API_KEY: ${AMD_API_KEY:-}
      MCP_ENABLED: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: nginx:alpine
    container_name: agentforge-frontend
    depends_on:
      - backend
    volumes:

      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  mysql-data:
